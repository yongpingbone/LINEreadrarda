name: Build LINE Radar APK

on:
  push:
    branches: [ main, ui/v0.4.2-person-first, exp/v0.5.2-display-noread, exp/v0.6-shizuku-noroot, exp/v0.7-root ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build debug APK
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "exp/v0.7-root" ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk LINE-Radar-v0.7.0-Root-LSPosed.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk LINE-Radar-v0.7.0-Shizuku.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LINE-Radar-${{ github.ref_name == 'exp/v0.7-root' && 'v0.7.0-Root-LSPosed' || 'v0.7.0-Shizuku' }}
          path: LINE-Radar-*.apk
          if-no-files-found: error
          retention-days: 14
