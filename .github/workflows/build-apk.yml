name: Build LINE Radar APK

on:
  push:
    branches: [ main, ui/v0.4.2-person-first, exp/v0.5.2-display-noread ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LINE-Radar-v0.5.4-Exp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LINE-Radar-v0.5.4-Exp
          path: LINE-Radar-v0.5.4-Exp.apk
          if-no-files-found: error
          retention-days: 14

# v0.5.4-exp: first monitoring setup works after Radar leaves the screen; no floating-window requirement
