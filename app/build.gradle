plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.linereadradar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.linereadradar'
        minSdk 26
        targetSdk 35
        versionCode 34
        versionName '0.7.0-shizuku'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
}
