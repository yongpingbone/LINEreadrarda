plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.linereadradar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.linereadradar'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.6.0-shizuku'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
